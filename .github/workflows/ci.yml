name: CI pruebas automatizadas en dev

on:
  push:
    branches: [ "main", "dev" ]
jobs:
  test_app:
    name: Ejecutar pruebas Python (Unit + Integración + E2E)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar estructura del proyecto
        run: |
          echo "Archivos en el repo:"
          ls -la
          echo "Archivos en tests:"
          find tests -type f || true

      - name: Ejecutar pruebas UNIT
        run: |
          echo "▶ Ejecutando pruebas UNIT..."
          python -m pytest tests/unit -m unit --cov=app --cov-report=term-missing

      - name: Ejecutar pruebas INTEGRACIÓN
        run: |
          echo "▶ Ejecutando pruebas de INTEGRACIÓN..."
          python -m pytest tests/integration -m integration -v

      - name: Ejecutar pruebas E2E
        run: |
          echo "▶ Ejecutando pruebas E2E..."
          python -m pytest tests/e2e -m e2e -v

      - name: Reporte final
        if: always()
        run: echo "✅ Pipeline finalizado. Revisa los resultados arriba."